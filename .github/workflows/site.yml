name: Site CI/CD

on:
  push:
    branches:
      - master
    paths:
      - "site/**"

  pull_request:
    branches:
      - master
    paths:
      - "site/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Site
        run: pnpm biome ci .

      - name: Type Check
        run: pnpm exec tsc --noEmit

      - name: Build Site
        run: pnpm build

      - name: Run Tests
        run: pnpm test --if-present